server {
    listen 80;
    listen [::]:80;
    server_name monzero.org www.monzero.org;

    root /var/www/monzero;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Same-origin, read-only node status endpoint used by the homepage. Keep
    # the trailing slash in sync with website/app.js.
    location = /api/node-info/ {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:6175/get_info;
        proxy_set_header Content-Type application/json;
        proxy_pass_request_headers on;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        add_header Cache-Control "no-store" always;
    }

    # The explorer and opt-in miner statistics endpoint require PHP. Point
    # fastcgi_pass at the PHP-FPM listener installed on the deployment host.
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }

    location ~ /\. {
        deny all;
    }

    location ~* \.(?:css|js|png|ico|svg|zip|tar\.gz|sha256)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
}
