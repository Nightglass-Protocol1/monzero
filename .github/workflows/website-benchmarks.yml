name: Website benchmark catalog
on:
  pull_request:
    paths:
      - 'website/mining/benchmarks/**'
      - 'tests/website/benchmarks.test.mjs'
      - 'utils/website/validate_benchmarks.mjs'
      - '.github/workflows/website-benchmarks.yml'
  push:
    paths:
      - 'website/mining/benchmarks/**'
      - 'tests/website/benchmarks.test.mjs'
      - 'utils/website/validate_benchmarks.mjs'
      - '.github/workflows/website-benchmarks.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node utils/website/validate_benchmarks.mjs
      - run: node --test tests/website/benchmarks.test.mjs
